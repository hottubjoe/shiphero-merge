<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>COLDEST Merge Engine — Sign in</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0d1117; color: #e6edf3; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  form { width: 320px; background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 28px; }
  h1 { font-size: 18px; letter-spacing: .12em; margin: 0 0 4px; }
  p { color: #8b949e; margin: 0 0 20px; font-size: 13px; }
  input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px; border: 1px solid #30363d; background: #0d1117; color: inherit; font-size: 15px; }
  button { margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 8px; background: #2f81f7; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
  .err { color: #f85149; font-size: 13px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>COLDEST</h1>
  <p>Order Merge Engine</p>
  <input type="password" name="password" placeholder="Dashboard password" autofocus required />
  <input type="hidden" name="next" id="next" value="/" />
  <button type="submit">Sign in</button>
  <div class="err" id="err">Wrong password.</div>
</form>
<script>
  const q = new URLSearchParams(location.search);
  if (q.has('error')) document.getElementById('err').style.display = 'block';
  // Come back to the same page after signing in (e.g. the TikTok connect page)
  document.getElementById('next').value = q.get('next') || (location.pathname !== '/' ? location.pathname + location.search : '/');
</script>
</body>
</html>
